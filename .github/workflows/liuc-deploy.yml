name: Liuc Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "all or a site name such as site-a"
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: liuc-new-api-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.targets.outputs.enabled }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select deployment targets
        id: targets
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
          SELECTED_TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -Eeuo pipefail
          if [[ "$DEPLOY_ENABLED" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            echo "Deployment disabled. Configure sites, then set DEPLOY_ENABLED=true." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          targets="$(bash deploy/select-targets.sh "$SELECTED_TARGET")"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: [checks, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare image name and application version
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf 'liuc-%s\n' "${GITHUB_SHA:0:12}" > VERSION

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [prepare, build]
    if: needs.prepare.outputs.enabled == 'true'
    name: Deploy ${{ matrix.site.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        site: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - name: Deploy site
        env:
          SITE_NAME: ${{ matrix.site.name }}
          DEPLOY_HOST: ${{ matrix.site.host }}
          DEPLOY_PORT: ${{ matrix.site.port }}
          DEPLOY_USER: ${{ matrix.site.user }}
          SSH_PRIVATE_KEY: ${{ secrets[matrix.site.ssh_key_secret] }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /opt/liuc-new-api/deploy.sh '$IMAGE'"
          printf 'Deployed `%s`: `%s`\n' "$SITE_NAME" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
